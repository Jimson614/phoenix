name: Family Core PostgreSQL Sandbox Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/family-core-sandbox-*"
    paths:
      - ".github/workflows/family-core-sandbox.yml"
      - "Phoenix Family OS/phoenix-family-os-mvp/backend/family-core-sandbox/**"
      - "Phoenix Family OS/phoenix-family-os-mvp/docs/family-core/**"
      - "Phoenix Family OS/phoenix-family-os-mvp/package.json"

permissions:
  contents: read

jobs:
  postgres-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: family-core-synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run policy, empty-build, RLS, rollback, backup and restore gates
        working-directory: Phoenix Family OS/phoenix-family-os-mvp
        env:
          FAMILY_CORE_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
          FAMILY_CORE_PG_BIN: /usr/lib/postgresql/17/bin
          FAMILY_CORE_RUN_SUFFIX: ci_${{ github.run_id }}_${{ github.run_attempt }}
          FAMILY_CORE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/family-core-gate
          PGPASSWORD: family-core-synthetic-ci-only
        run: npm run family-core:gate

      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-core-gate-${{ github.sha }}
          path: artifacts/family-core-gate/
          if-no-files-found: error
          retention-days: 14
