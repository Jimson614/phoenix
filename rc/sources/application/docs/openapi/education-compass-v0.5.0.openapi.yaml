        analysisType: { type: string, enum: [ASSESSMENT_ANALYSIS, REPORT_ANALYSIS] }
        remainingReplies: { type: integer, minimum: 0 }
        retryAfterMs: { type: integer, minimum: 0 }
        reply: { $ref: '#/components/schemas/AgentReply' }
