        enabled: { const: false }
        consentVersion: { const: agent_analysis_opt_in_v1.0.0-rc1 }
        updatedAt: { type: string, format: date-time }
    AgentSource:
      type: object
      additionalProperties: false
      required: [alias, name, applicableYear, verifiedAt, dataVersion]
      properties:
        alias: { type: string }
