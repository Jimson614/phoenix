name: CI Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CI gate
        run: pnpm ci:gate
