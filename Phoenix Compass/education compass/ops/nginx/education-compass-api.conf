# Education Compass API —— api.phoenixnova.com.cn
#
# 部署位置：/etc/nginx/sites-available/education-compass-api，软链到 sites-enabled。
# 证书由 certbot 以 webroot 方式签发（/var/www/letsencrypt），续期走下面的 80 端口
# acme-challenge，所以那段必须排在跳转之前。
#
# ⚠️ 当前 443 反代的是**联调后端**（127.0.0.1:3010，NODE_ENV=development、模拟支付）。
# 生产后端（127.0.0.1:3100）还没通过启动闸门。切到生产时改 proxy_pass 的端口，
# 并同步把 server/.env 的 PUBLIC_BASE_URL 改成 https://api.phoenixnova.com.cn。

# 小程序会轮询订单状态，给足余量，同时挡住脚本刷接口。
limit_req_zone $binary_remote_addr zone=education_compass_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.phoenixnova.com.cn;

    # 证书续期校验只能走明文 80，必须放在 301 之前。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.phoenixnova.com.cn;

    ssl_certificate         /etc/letsencrypt/live/api.phoenixnova.com.cn/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.phoenixnova.com.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.phoenixnova.com.cn/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EducationCompassTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # 客户端没有任何上传，问卷和追问都是小体积 JSON。
    client_max_body_size 512k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # 管理接口不对公网开放：小程序从不调用它们。
    location ^~ /v1/admin/ {
        return 404;
    }

    location / {
        limit_req zone=education_compass_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用只在 peer 是 127.0.0.1 时才读这个头，且取链末一项；
        # 客户端伪造的前缀会被 nginx 追加的真实 IP 覆盖。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # 报告生成和 AI 分析比普通请求慢，读超时留足。
        proxy_read_timeout 60s;
    }
}

# 用 IP 或未知域名访问 443 时直接断开，不把接口暴露给扫描器。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/api.phoenixnova.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phoenixnova.com.cn/privkey.pem;

    return 444;
}
